name: Dependency Audit

on:
  pull_request:
    branches: [clean-master]
  push:
    branches: [clean-master]
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - backend
          - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit production dependencies (${{ matrix.project }})
        run: npm --prefix ${{ matrix.project }} --workspaces=false audit --omit=dev --audit-level=high